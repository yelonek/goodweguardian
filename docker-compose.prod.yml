services:
  guardian:
    build: .
    image: goodweguardian:latest
    container_name: guardian
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Warsaw
    command: ["python", "hourly_balance_run.py"]
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
      - ./data:/app/data

  dashboard:
    image: goodweguardian:latest
    container_name: guardian-dashboard
    restart: unless-stopped
    depends_on: [guardian]
    env_file: .env
    environment:
      TZ: Europe/Warsaw
    command: ["uvicorn", "guardian_dashboard:app", "--host", "0.0.0.0", "--port", "8501"]
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
      - ./data:/app/data

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: guardian-ntfy
    restart: unless-stopped
    command: ["serve"]
    environment:
      TZ: Europe/Warsaw
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://127.0.0.1:2586}
      NTFY_BEHIND_PROXY: "true"
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
    volumes:
      - ./data/ntfy:/var/lib/ntfy
    ports:
      - "127.0.0.1:2586:80"
